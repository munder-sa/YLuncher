<?xml version="1.0" encoding="UTF-8"?>
<!-- YLuncher - home wallpaper, 1920x1080 (source for wallpaper.png).
     Near-black with a whisper-quiet split-panels motif in the center.
     The motif sits fully inside the central area, so center crops to
     other aspect ratios (4:3, 1:1, 21:9) never cut anything important.
     It is meant to stay behind the home UI: keep contrast very low. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101016"/>
      <stop offset="1" stop-color="#0A0A0E"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.045"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="0" y="0" width="1920" height="1080" fill="url(#bg)"/>
  <ellipse cx="960" cy="540" rx="900" ry="520" fill="url(#glow)"/>
  <!-- split motif: left 60% / right 40%, gap 16, total 880x500 centered -->
  <g fill="#FFFFFF" opacity="0.045">
    <rect x="520" y="290" width="528" height="500" rx="48"/>
    <rect x="1064" y="290" width="336" height="500" rx="48"/>
  </g>
  <!-- faint lime hairline in the split gap -->
  <rect x="1054" y="340" width="4" height="400" rx="2" fill="#8FE63B" opacity="0.12"/>
</svg>
