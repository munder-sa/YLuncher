<?xml version="1.0" encoding="UTF-8"?>
<!-- YLuncher adaptive icon - foreground layer (108x108, transparent)
     Motif: split screen 60:40. Left panel = video (play), right panel = music (note).
     Artwork is kept inside the adaptive-icon safe zone (center ~66%). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108">
  <!-- panels -->
  <rect x="24" y="25" width="34" height="58" rx="7" fill="#2E2E38"/>
  <rect x="62" y="25" width="22" height="58" rx="7" fill="#2E2E38"/>
  <!-- play glyph (Material Symbols play_arrow path, 24-grid) -->
  <g transform="translate(20.1 35.4) scale(1.55)" fill="#8FE63B">
    <path d="M8 5v14l11-7z"/>
  </g>
  <!-- music note glyph (Material Symbols music_note path, 24-grid) -->
  <g transform="translate(57 38) scale(1.33)" fill="#8FE63B">
    <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
  </g>
</svg>
