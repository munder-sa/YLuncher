<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>歌詞切り替えボタン · 6つのアイコン案</title>
<style>
:root{color-scheme:dark;--panel:#2E2E38;--muted:#B0B0BB;--control:#454550}
*{box-sizing:border-box}
body{margin:0;padding:32px;background:#0B0B0F;color:white;font:16px/1.6 system-ui,sans-serif}
h1{margin:0 0 8px;font-size:28px}h2{margin:0 0 8px;font-size:21px}p{margin:0 0 16px}.muted,.description{color:var(--muted)}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:16px;margin:24px 0;padding:20px;background:#202028;border-radius:20px}
select{max-width:100%;font:inherit;color:white;background:var(--control);border:1px solid var(--muted);border-radius:12px;padding:12px}
label{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
button,select{cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid white;outline-offset:4px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px}
.card{background:var(--panel);border-radius:24px;padding:24px}.description{min-height:52px}
.pair{display:flex;gap:32px;align-items:start}.sample{display:flex;flex-direction:column;align-items:center;gap:8px;width:100px;text-align:center}.state{font-size:14px;color:var(--muted)}
.icon-button{display:grid;place-items:center;width:72px;height:72px;flex:0 0 72px;padding:0;border:0;border-radius:50%;background:var(--control);color:white}
.icon-button[aria-pressed="true"],.icon-button.on{background:white;color:#0B0B0F}
.icon-button svg{width:40px;height:40px;fill:none;stroke:currentColor;stroke-width:2.75;stroke-linecap:round;stroke-linejoin:round}
.small{margin-top:20px}.small .icon-button{width:48px;height:48px;flex-basis:48px}.small svg{width:28px;height:28px}
.size{font-size:13px;color:var(--muted);margin:16px 0 8px}.destination{font-size:14px;color:var(--muted);margin:16px 0 0}
.preview-section{margin-top:40px}.strip-scroll{overflow-x:auto;padding:8px 0 16px}
.strip{position:relative;width:409px;height:124px;padding:40px;background:var(--panel);border-radius:24px}
.app{height:44px;display:flex;align-items:center;gap:8px;color:var(--muted)}
.app-icon{width:36px;height:36px;flex:0 0 36px;display:grid;place-items:center;border-radius:8px;background:var(--control);color:white}
.app-icon svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.app-name{font-size:18px;white-space:nowrap}.strip .icon-button{position:absolute;right:26px;top:26px}
#preview-status{color:var(--muted);margin-top:8px}footer{margin-top:24px;color:var(--muted);font-size:14px}
@media(max-width:380px){body{padding:16px}.cards{grid-template-columns:minmax(0,1fr)}}
</style>
</head>
<body>
<h1>歌詞 ↔ ジャケットの切り替え</h1>
<p class="muted">6案の比較 · 1 CSS px = 1dp。各カードは固定の状態見本です。下の実寸帯で切り替えを試せます。</p>
<div class="toolbar">
 <label for="proposal">実寸帯のアイコン<select id="proposal">
  <option value="0">1 · 吹き出し+行</option>
  <option value="1">2 · 行の強調</option>
  <option value="2">3 · 音符+行</option>
  <option value="3">4 · マイク</option>
  <option value="4">5 · 引用符の吹き出し</option>
  <option value="5">6 · 行き先を示す切り替え</option>
 </select></label>
 <span class="muted">帯の右端のボタンを押すと、オフ／オンが入れ替わります。</span>
</div>
<main>
 <div id="cards" class="cards"></div>
 <section class="preview-section" aria-labelledby="preview-heading">
  <h2 id="preview-heading">案Aの上部 · 実寸プレビュー</h2>
  <p class="muted">幅409dp · アプリ名の行44dp · ボタン72dp。狭い画面では横にスクロールできます。</p>
  <div class="strip-scroll">
   <div class="strip">
    <div class="app"><span class="app-icon" aria-hidden="true"><svg viewBox="0 0 26 26"><path d="M11 18V6l10-2v12M11 9l10-2"/><ellipse cx="7.5" cy="19" rx="3.5" ry="2.5"/><ellipse cx="17.5" cy="17" rx="3.5" ry="2.5"/></svg></span><span class="app-name">Apple Music</span></div>
    <button id="preview-toggle" class="icon-button" type="button" aria-label="歌詞表示" aria-pressed="false" aria-describedby="preview-status"></button>
   </div>
  </div>
  <p id="preview-status" role="status"></p>
 </section>
</main>
<footer>比較用のモックです。カードの上段は図柄40dp／円72dp、下段は図柄28dp／円48dp。アプリ名は配置確認用の文字で、ロゴは使用していません。</footer>
<script>
'use strict';
const bubble='<path d="M9 6h22a5 5 0 0 1 5 5v15a5 5 0 0 1-5 5H17l-8 5v-5a5 5 0 0 1-5-5V11a5 5 0 0 1 5-5Z"/>';
const lines='<path d="M8 10h19M8 20h24M8 30h19"/>';
const artwork='<rect x="5" y="5" width="30" height="30" rx="4"/><circle cx="26" cy="14" r="3"/><path d="m6 29 10-12 9 10 4-4 6 7"/>';
const specs=[
 {name:'吹き出し+行',description:'言葉を表す吹き出しに、歌詞の行を添える。',shape:bubble+'<path d="M12 14h16M12 22h12"/>'},
 {name:'行の強調',description:'中央の行を太く長くし、同期歌詞の「今の行」を表す。',shape:'<path d="M10 10h20M10 30h20"/><rect x="5" y="18.5" width="30" height="3" rx="1.5" fill="currentColor" stroke="none"/>'},
 {name:'音符+行',description:'左の音符と右の行で、音楽に付く言葉を表す。',shape:'<path d="M13 27V9l6-2v7M24 12h11M24 20h11M24 28h8"/><ellipse cx="8.5" cy="28" rx="4.5" ry="3.5"/>'},
 {name:'マイク',description:'カプセル形のマイクで、歌う・カラオケを連想させる。',shape:'<rect x="14" y="4" width="12" height="22" rx="6"/><path d="M9 19v2a11 11 0 0 0 22 0v-2M20 32v4M14 36h12"/>'},
 {name:'引用符の吹き出し',description:'吹き出しの中の開始引用符で、歌詞の引用を表す。',shape:bubble+'<path d="M16 13c-4 1-6 4-6 9h6v-6h-5M28 13c-4 1-6 4-6 9h6v-6h-5"/>'},
 {name:'行き先を示す切り替え',description:'ジャケット表示中は行、歌詞表示中は画像で、押した先を示す。',shape:lines,onShape:artwork}
];
function icon(index,on){
 const spec=specs[index];
 return `<svg viewBox="0 0 40 40" aria-hidden="true" focusable="false">${on&&spec.onShape?spec.onShape:spec.shape}</svg>`;
}
const cards=document.querySelector('#cards');
specs.forEach((spec,index)=>{
 const card=document.createElement('article');
 card.className='card';
 card.setAttribute('aria-labelledby',`heading-${index}`);
 const pair=()=>[false,true].map(on=>`<div class="sample"><span class="state">${on?'オン':'オフ'}<br>${on?'歌詞表示中':'ジャケット表示中'}</span><span class="icon-button ${on?'on':''}" role="img" aria-label="${spec.name}・${on?'オン':'オフ'}の見本">${icon(index,on)}</span></div>`).join('');
 card.innerHTML=`<h2 id="heading-${index}">${index+1} · ${spec.name}</h2><p class="description">${spec.description}</p><p class="size">72dp · 図柄40dp</p><div class="pair">${pair()}</div><div class="small"><p class="size">48dp · 図柄28dp</p><div class="pair">${pair()}</div></div>${spec.onShape?'<p class="destination">この案だけオン時に図柄が変わります：行 → 正方形の画像（山と丸）。</p>':''}`;
 cards.append(card);
});
const selection=document.querySelector('#proposal');
const toggle=document.querySelector('#preview-toggle');
const status=document.querySelector('#preview-status');
let showLyrics=false;
function render(){
 const index=Number(selection.value);
 toggle.innerHTML=icon(index,showLyrics);
 toggle.setAttribute('aria-pressed',String(showLyrics));
 status.textContent=`${index+1} · ${specs[index].name} ／ ${showLyrics?'オン：歌詞表示中':'オフ：ジャケット表示中'} ／ 押すと${showLyrics?'ジャケット':'歌詞'}表示へ`;
}
selection.addEventListener('change',render);
toggle.addEventListener('click',()=>{showLyrics=!showLyrics;render();});
render();
</script>
</body>
</html>
