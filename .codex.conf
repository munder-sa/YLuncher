CHECK_PORTS=()
CHECK_PROCS=()
EXCLUDE_DIRS=(.git .codex-bak tasks .gradle .idea .kotlin build app/build)
# Gradle はルート外の ~/.gradle (キャッシュ・デーモン) と ~/.android (デバッグ署名鍵) に書く
ADD_DIRS=("$HOME/.gradle" "$HOME/.android")
# Gradle デーモンはループバック通信が要るため、サンドボックスのネットワークを開く
NETWORK=1
# 検証コマンド (codex-verify が実行)。WSL の JDK17+SDK を ~/tools に入れてある
VERIFY_CMDS=('$HOME/tools/gradle-run.sh test assembleDebug')
